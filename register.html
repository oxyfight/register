<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ระบบลงทะเบียนออนไลน์ - OXFIGHT CENTER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary-color: #071f54; --card-bg: rgba(255, 255, 255, 0.96); }
    * { box-sizing: border-box; font-family: 'Sarabun', sans-serif !important; }
    body { min-height: 100vh; background: linear-gradient(135deg, #f4f8ff 0%, #eaf3ff 100%); color: #1f2937; }
    .page-shell { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .form-container { width: min(100%, 760px); background: var(--card-bg); padding: 40px; border-radius: 28px; box-shadow: 0 28px 80px rgba(7,31,84,0.15); position: relative; overflow: hidden; }
    .form-container::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 9px; background: linear-gradient(90deg, #071f54, #1976d2); }
    .header { text-align: center; margin-bottom: 30px; }
    .header img { max-width: 240px; height: auto; }
    #successOverlay { display: none; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.99); z-index: 100; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 36px; }
    .form-label { font-weight: 700; color: #233044; }
    .form-control, .form-select { min-height: 50px; border-radius: 14px; border: 1px solid #d7e2f2; }
    .btn-submit { background: linear-gradient(135deg, #1976d2, #071f54); border: none; padding: 15px; border-radius: 999px; width: 100%; color: white; font-weight: 800; transition: 0.2s; }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .confirm-label { font-weight: 800; color: #52637a; width: 130px; display: inline-block; }
  </style>
</head>
<body>

  <main class="page-shell">
    <div class="form-container">
      
      <div id="successOverlay">
        <div style="font-size: 80px;" class="mb-2">✅</div>
        <h2 class="text-success fw-bold mb-1">ลงทะเบียนสำเร็จ!</h2>
        <p class="text-muted">โปรดแคปหน้าจอเก็บรหัสลงทะเบียนนี้ไว้แสดงต่อเจ้าหน้าที่หน้างาน</p>
        <div class="p-4 bg-light rounded-4 w-100 mb-4 border text-center shadow-sm" style="max-width: 450px;">
          <span id="displayResId" class="text-primary fw-bold fs-1" style="letter-spacing: 2px;"></span>
        </div>
        <div class="alert alert-info py-2 px-4 rounded-pill small mb-4">📧 ระบบได้จัดส่ง QR Code ยืนยันเข้าสู่อีเมลของท่านแล้ว</div>
        <button class="btn btn-outline-secondary rounded-pill px-5 fw-bold" onclick="location.reload()">ลงทะเบียนคนถัดไป</button>
      </div>

      <div class="header">
        <img src="https://knfhgytkfshdmfdieczx.supabase.co/storage/v1/object/public/pic/OXYFIGHT_CENTER.png" alt="OXFIGHT CENTER LOGO">
        <h4 class="mt-3 fw-bold text-primary">ระบบลงทะเบียนเข้ารับการฝึกอบรมออนไลน์</h4>
        <p class="text-muted small">กรุณากรอกข้อมูลส่วนบุคคลให้ถูกต้องเพื่อใช้ในการออกวุฒิบัตร</p>
      </div>

      <form id="regForm" onkeydown="return event.key != 'Enter';">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">คำนำหน้าชื่อ</label>
            <select class="form-select" id="inp_prefix" required>
              <option value="">เลือก...</option>
              <option value="นาย">นาย</option>
              <option value="นาง">นาง</option>
              <option value="นางสาว">นางสาว</option>
            </select>
          </div>
          <div class="col-md-8 mb-3">
            <label class="form-label">ชื่อ - นามสกุล (ภาษาไทย)</label>
            <input type="text" class="form-control" id="inp_name" required placeholder="กรอกชื่อและนามสกุลจริง">
          </div>
        </div>
        
        <div class="mb-3">
          <label class="form-label">เบอร์โทรศัพท์ติดต่อ</label>
          <input type="tel" class="form-control" id="inp_phone" required placeholder="08XXXXXXXX" pattern="[0-9]{9,10}">
        </div>
        
        <div class="mb-3">
          <label class="form-label">อีเมลติดต่อ <span class="text-danger small">(แนะนำให้ใช้ @gmail.com เท่านั้น)</span></label>
          <input type="email" class="form-control" id="inp_email" required placeholder="example@gmail.com">
        </div>
        
        <div class="mb-4">
          <label class="form-label">หลักสูตรและรอบวันที่ต้องการเข้าอบรม</label>
          <select class="form-select" id="date" required>
            <option value="">กำลังโหลดรายการหลักสูตรจากศูนย์การเรียนรู้...</option>
          </select>
        </div>
        
        <button type="button" class="btn btn-submit shadow-sm fs-5" onclick="showConfirm()">ลงทะเบียนเข้าร่วมอบรม</button>
      </form>
    </div>
  </main>

  <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 20px; overflow: hidden; border: none;">
        <div class="modal-header bg-primary text-white py-3">
          <h5 class="modal-title fw-bold"><i class="fas fa-user-check me-2"></i>ตรวจสอบข้อมูลการลงทะเบียน</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="confirmData"></div>
        <div class="modal-footer bg-light border-top-0">
          <button type="button" class="btn btn-link text-muted text-decoration-none fw-bold" data-bs-dismiss="modal">แก้ไขข้อมูล</button>
          <button type="button" class="btn btn-primary px-4 rounded-pill fw-bold" id="confirmBtn" onclick="submitForm()">ยืนยันข้อมูลข้อมูล</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://knfhgytkfshdmfdieczx.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuZmhneXRrZnNoZG1mZGllY3p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDI4ODUsImV4cCI6MjA5NDQxODg4NX0.NnYLZB5agt5wjLs2vn62K5v9LnvO01BV3iCJhh-QRTE"; 
    const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbybDrwPwdjzpdrg_qTJ7Em8B4x-lFcPPCF871VE9siziL4xee_Aewotgn-CtY9_lNF-/exec"; 

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
    let loadedSessions = []; 

    window.addEventListener('DOMContentLoaded', loadSessions);

    // ดึงรายชื่อหลักสูตรรอบอบรมจากตารางแอดมินมาประกอบร่าง Dropdown
    async function loadSessions() {
      const dateSelect = document.getElementById('date');
      try {
        const { data: sessions, error } = await supabaseClient.from('sessions').select('*').eq('status', 'Active').order('id', { ascending: true });
        if (error) throw error;
        
        loadedSessions = sessions;
        dateSelect.innerHTML = '<option value="">-- เลือกหลักสูตรและรอบวันเวลา --</option>';
        
        sessions.forEach(session => {
          const option = document.createElement('option');
          option.value = session.id; 
          let statusText = `(ว่าง ${session.available_seats}/${session.max_seats} ที่นั่ง)`;
          if (session.available_seats <= 0) { option.disabled = true; statusText = `(ที่นั่งเต็มแล้ว)`; }
          
          // 🌟 ดึงฟอร์แมตโครงสร้าง Name (หลักสูตร) และ Date (วันที่จัด พ.ศ.) มาประกอบอย่างลงตัว
          option.textContent = `📘 ${session.name} [รอบ: ${session.date}] ${statusText}`;
          dateSelect.appendChild(option);
        });
      } catch (error) { 
        console.error("โหลดข้อมูลรอบอบรมไม่สำเร็จ: ", error); 
        dateSelect.innerHTML = '<option value="">❌ เกิดข้อผิดพลาดขัดข้องในการโหลดข้อมูลอบรม</option>';
      }
    }

    function showConfirm() {
      const form = document.getElementById('regForm');
      const emailInput = document.getElementById('inp_email');
      emailInput.value = emailInput.value.trim();
      
      if(!form.checkValidity()) { form.reportValidity(); return; }

      const prefix = document.getElementById('inp_prefix').value;
      const name = document.getElementById('inp_name').value;
      const selectedSession = loadedSessions.find(s => s.id == document.getElementById('date').value);

      document.getElementById('confirmData').innerHTML = `
        <p class="mb-2"><span class="confirm-label">ชื่อ - นามสกุล:</span> <b class="text-dark">${prefix}${name}</b></p>
        <p class="mb-2"><span class="confirm-label">เบอร์โทรศัพท์:</span> <b class="text-dark">${document.getElementById('inp_phone').value}</b></p>
        <p class="mb-2"><span class="confirm-label">อีเมลติดต่อ:</span> <b class="text-dark">${emailInput.value}</b></p>
        <hr>
        <p class="mb-1 text-muted small fw-bold">หลักสูตรศึกษาอบรมที่เลือก:</p>
        <div class="p-3 bg-light border text-center fw-bold text-primary rounded-3 fs-6">
            ${selectedSession.name}<br>
            <span class="text-muted small fw-normal">ตารางจัด: ${selectedSession.date}</span>
        </div>`;
      confirmModal.show();
    }

    async function submitForm() {
      const btn = document.getElementById('confirmBtn');
      // 🔒 สั่งล็อกปุ่มทันทีเพื่อป้องกันการกดเบิ้ลส่งข้อมูลซ้ำซ้อนซ้อนแถว
      btn.disabled = true; 
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังบันทึกข้อมูล...';

      const prefix = document.getElementById('inp_prefix').value;
      const fullName = document.getElementById('inp_name').value;
      const phone = document.getElementById('inp_phone').value;
      const email = document.getElementById('inp_email').value;
      const sessionId = document.getElementById('date').value;

      try {
        // 1. ตรวจสอบโควตาวันหมดเขต/ที่นั่งแบบเรียลไทม์ด่านสุดท้ายก่อนบันทึกจริง
        const { data: currentSession, error: checkError } = await supabaseClient.from('sessions').select('available_seats, name, date').eq('id', sessionId).single();
        if (checkError) throw checkError;
        if (currentSession.available_seats <= 0) throw new Error("ขออภัยด้วยครับ รอบการอบรมหลักสูตรนี้ที่นั่งเต็มแล้ว ณ จังหวะที่คุณกดยืนยัน");

        // 2. ยิงข้อมูลผู้สมัครเข้าตารางฐานข้อมูลหลักของ Supabase
        const { data: insertedData, error: insertError } = await supabaseClient.from('registrations').insert([{ prefix, full_name: fullName, phone, email, session_id: parseInt(sessionId) }]).select('id').single();
        if (insertError) throw insertError;
        const generatedRegId = insertedData.id; // ดึงรหัส REG ID 6 หลักที่ระบบดีบีสุ่มสร้างให้อัตโนมัติ

        // 3. หักลบโควตาที่นั่งว่างคงเหลือออก 1 ที่นั่ง
        await supabaseClient.from('sessions').update({ available_seats: currentSession.available_seats - 1 }).eq('id', sessionId);

        // 4. ส่งผ่านข้อมูลคู่ขนานข้ามแพลตฟอร์มไปหา Google Apps Script API เพื่อบันทึกกูเกิลชีตและส่งอีเมล QR Code หาผู้สมัคร
        const fullSessionString = `${currentSession.name} (${currentSession.date})`;
        fetch(GOOGLE_SHEET_API, {
          method: "POST",
          mode: "no-cors",
          body: new URLSearchParams({ "action": "registerOnline", "id": generatedRegId, prefix, fullName, phone, email, "sessionName": fullSessionString })
        });

        // 5. ปิดม่านป๊อปอัพและแสดงหน้าต่างความสำเร็จพรีเมียม
        confirmModal.hide();
        document.getElementById('displayResId').innerText = generatedRegId;
        document.getElementById('successOverlay').style.display = 'flex';
        document.getElementById('regForm').reset();
      } catch (err) { 
        alert("ระบบขัดข้อง: " + err.message); 
        btn.disabled = false; 
        btn.innerHTML = 'ยืนยันข้อมูลข้อมูล'; 
      }
    }
  </script>
</body>
</html>
